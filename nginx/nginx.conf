events { worker_connections 1024; }

http {
  upstream backend       { server backend:8000; }
  upstream frontend      { server frontend:3000; }
  upstream training_api  { server training-api:8001; }

  # Large uploads for dataset images/videos
  client_max_body_size 2g;

  server {
    listen 80;
    server_name _;

    # Frontend
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Inference Backend API
    location /api/v1/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Training API (prefix: /api/v1/training/)
    location /api/v1/training/ {
      proxy_pass http://training_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Large file uploads
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      client_max_body_size 2g;
    }

    # Inference WebSocket
    location /ws/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 86400;
    }

    # Training WebSocket
    location /ws/training/ {
      proxy_pass http://training_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 86400;
    }

    # MJPEG stream
    location /api/v1/stream/ {
      proxy_pass http://backend;
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Host $host;
    }

    # Static storage
    location /storage/ {
      alias /app/storage/;
      expires 1d;
      add_header Cache-Control "public";
    }

    # Training data (dataset images)
    location /data/ {
      alias /app/training/;
      expires 1h;
    }
  }
}
