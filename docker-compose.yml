name: bevp

services:
  # в”Ђв”Ђ PostgreSQL в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
  postgres:
    image: postgres:16-alpine
    container_name: bevp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bevp_db
      POSTGRES_USER: bevp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bevp_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bevp_user -d bevp_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # в”Ђв”Ђ Redis в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
  redis:
    image: redis:7-alpine
    container_name: bevp-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # в”Ђв”Ђ Inference Backend в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        ENABLE_EXPERIMENTAL_AI: ${ENABLE_EXPERIMENTAL_AI:-true}
    container_name: bevp-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://bevp_user:${POSTGRES_PASSWORD:-bevp_pass}@postgres:5432/bevp_db
      DATABASE_SYNC_URL: postgresql://bevp_user:${POSTGRES_PASSWORD:-bevp_pass}@postgres:5432/bevp_db
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-change-me-super-secret-key-at-least-32-characters}
      FERNET_KEY: ${FERNET_KEY:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@bevp.local}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-admin123}
      STORAGE_PATH: /app/storage
      CROPS_PATH: /app/storage/crops
      FRAMES_PATH: /app/storage/frames
      VIDEOS_PATH: /app/storage/videos
      MAX_VIDEO_UPLOAD_BYTES: ${MAX_VIDEO_UPLOAD_BYTES:-2147483648}
      CORS_ORIGINS: '["http://localhost:3100","http://127.0.0.1:3100","http://frontend:3000"]'
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      OPENCV_FFMPEG_CAPTURE_OPTIONS: ${OPENCV_FFMPEG_CAPTURE_OPTIONS:-allowed_extensions;ALL}
    volumes:
      - ./backend/models:/app/models
      - bevp_storage:/app/storage
      - ai_model_cache:/home/bevp/.cache
    ports:
      - "8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # в”Ђв”Ђ Frontend в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8100}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8100}
        NEXT_PUBLIC_TRAINING_API_URL: ${NEXT_PUBLIC_TRAINING_API_URL:-http://localhost:8101}
        NEXT_PUBLIC_TRAINING_WS_URL: ${NEXT_PUBLIC_TRAINING_WS_URL:-ws://localhost:8101}
    container_name: bevp-frontend
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8100}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8100}
      NEXT_PUBLIC_TRAINING_API_URL: ${NEXT_PUBLIC_TRAINING_API_URL:-http://localhost:8101}
      NEXT_PUBLIC_TRAINING_WS_URL: ${NEXT_PUBLIC_TRAINING_WS_URL:-ws://localhost:8101}
    ports:
      - "3100:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # в”Ђв”Ђ Training API в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
  training-api:
    build:
      context: ./training/backend
      dockerfile: Dockerfile
    container_name: bevp-training-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://bevp_user:${POSTGRES_PASSWORD:-bevp_pass}@postgres:5432/bevp_db
      DATABASE_SYNC_URL: postgresql://bevp_user:${POSTGRES_PASSWORD:-bevp_pass}@postgres:5432/bevp_db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AI_RUNTIME: control-plane
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-change-me-super-secret-key-at-least-32-characters}
      DATA_ROOT: /app/data
      DATASETS_PATH: /app/data/datasets
      UPLOADS_PATH: /app/data/uploads
      MODELS_PATH: /app/data/models
      EXPORTS_PATH: /app/data/exports
      LOGS_PATH: /app/data/logs
      INFERENCE_MODELS_PATH: /app/inference_models
      SOURCE_STORAGE_PATH: /app/source_storage
      CORS_ORIGINS: '["http://localhost:3100","http://frontend:3000"]'
    volumes:
      - training_data:/app/data
      - ./backend/models:/app/inference_models   # shared with inference backend
      - bevp_storage:/app/source_storage:ro
    ports:
      - "8101:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/training/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # в”Ђв”Ђ Training GPU Worker в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
  training-worker:
    build:
      context: ./training/backend
      dockerfile: ../Dockerfile.worker.cpu
    container_name: bevp-training-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://bevp_user:${POSTGRES_PASSWORD:-bevp_pass}@postgres:5432/bevp_db
      DATABASE_SYNC_URL: postgresql://bevp_user:${POSTGRES_PASSWORD:-bevp_pass}@postgres:5432/bevp_db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-change-me-super-secret-key-at-least-32-characters}
      DATA_ROOT: /app/data
      DATASETS_PATH: /app/data/datasets
      EXPORTS_PATH: /app/data/exports
      LOGS_PATH: /app/data/logs
      INFERENCE_MODELS_PATH: /app/inference_models
      SOURCE_STORAGE_PATH: /app/source_storage
    volumes:
      - training_data:/app/data
      - ./backend/models:/app/inference_models
      - bevp_storage:/app/source_storage:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # в”Ђв”Ђ Celery Flower (task monitor) в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
  flower:
    build:
      context: ./training/backend
      dockerfile: Dockerfile
    container_name: bevp-flower
    restart: unless-stopped
    command: >
      celery -A app.celery_app flower
      --port=5555
      --broker=redis://redis:6379/1
      --url_prefix=flower
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
    ports:
      - "5565:5555"
    depends_on:
      - redis
    profiles:
      - monitoring

  # в”Ђв”Ђ Nginx в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ
  nginx:
    image: nginx:alpine
    container_name: bevp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - bevp_storage:/app/storage:ro
      - training_data:/app/training:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  bevp_storage:
  training_data:
  ai_model_cache:
