services:
  # ── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vtp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vtp_db
      POSTGRES_USER: vtp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vtp_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtp_user -d vtp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vtp-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Inference Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        ENABLE_EXPERIMENTAL_AI: ${ENABLE_EXPERIMENTAL_AI:-true}
    container_name: vtp-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://vtp_user:${POSTGRES_PASSWORD:-vtp_pass}@postgres:5432/vtp_db
      DATABASE_SYNC_URL: postgresql://vtp_user:${POSTGRES_PASSWORD:-vtp_pass}@postgres:5432/vtp_db
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-change-me-super-secret-key-at-least-32-characters}
      FERNET_KEY: ${FERNET_KEY:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@vtp.local}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-admin123}
      STORAGE_PATH: /app/storage
      CROPS_PATH: /app/storage/crops
      FRAMES_PATH: /app/storage/frames
      VIDEOS_PATH: /app/storage/videos
      MAX_VIDEO_UPLOAD_BYTES: ${MAX_VIDEO_UPLOAD_BYTES:-2147483648}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://frontend:3000"]'
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      OPENCV_FFMPEG_CAPTURE_OPTIONS: ${OPENCV_FFMPEG_CAPTURE_OPTIONS:-allowed_extensions;ALL}
    volumes:
      - ./backend/models:/app/models
      - vtp_storage:/app/storage
      - ocr_cache:/home/vtp/.paddleocr
      - paddlex_cache:/home/vtp/.paddlex
      - easyocr_cache:/home/vtp/.EasyOCR
      - ai_model_cache:/home/vtp/.cache
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
        NEXT_PUBLIC_TRAINING_API_URL: ${NEXT_PUBLIC_TRAINING_API_URL:-http://localhost:8001}
        NEXT_PUBLIC_TRAINING_WS_URL: ${NEXT_PUBLIC_TRAINING_WS_URL:-ws://localhost:8001}
    container_name: vtp-frontend
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      NEXT_PUBLIC_TRAINING_API_URL: ${NEXT_PUBLIC_TRAINING_API_URL:-http://localhost:8001}
      NEXT_PUBLIC_TRAINING_WS_URL: ${NEXT_PUBLIC_TRAINING_WS_URL:-ws://localhost:8001}
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - training-api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Training API ──────────────────────────────────────────────
  training-api:
    build:
      context: ./training/backend
      dockerfile: Dockerfile
    container_name: vtp-training-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://vtp_user:${POSTGRES_PASSWORD:-vtp_pass}@postgres:5432/vtp_db
      DATABASE_SYNC_URL: postgresql://vtp_user:${POSTGRES_PASSWORD:-vtp_pass}@postgres:5432/vtp_db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-change-me-super-secret-key-at-least-32-characters}
      DATA_ROOT: /app/data
      DATASETS_PATH: /app/data/datasets
      UPLOADS_PATH: /app/data/uploads
      MODELS_PATH: /app/data/models
      EXPORTS_PATH: /app/data/exports
      LOGS_PATH: /app/data/logs
      INFERENCE_MODELS_PATH: /app/inference_models
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000"]'
    volumes:
      - training_data:/app/data
      - ./backend/models:/app/inference_models   # shared with inference backend
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/training/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Training GPU Worker ───────────────────────────────────────
  training-worker:
    build:
      context: ./training/backend
      dockerfile: ../Dockerfile.worker.cpu
    container_name: vtp-training-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://vtp_user:${POSTGRES_PASSWORD:-vtp_pass}@postgres:5432/vtp_db
      DATABASE_SYNC_URL: postgresql://vtp_user:${POSTGRES_PASSWORD:-vtp_pass}@postgres:5432/vtp_db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-change-me-super-secret-key-at-least-32-characters}
      DATA_ROOT: /app/data
      DATASETS_PATH: /app/data/datasets
      EXPORTS_PATH: /app/data/exports
      LOGS_PATH: /app/data/logs
      INFERENCE_MODELS_PATH: /app/inference_models
    volumes:
      - training_data:/app/data
      - ./backend/models:/app/inference_models
    depends_on:
      - redis
      - postgres
      - training-api

  # ── Celery Flower (task monitor) ──────────────────────────────
  flower:
    build:
      context: ./training/backend
      dockerfile: Dockerfile
    container_name: vtp-flower
    restart: unless-stopped
    command: >
      celery -A app.celery_app flower
      --port=5555
      --broker=redis://redis:6379/1
      --url_prefix=flower
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
    ports:
      - "5555:5555"
    depends_on:
      - redis
    profiles:
      - monitoring

  # ── Nginx ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: vtp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - vtp_storage:/app/storage:ro
      - training_data:/app/training:ro
    depends_on:
      - backend
      - frontend
      - training-api
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  vtp_storage:
  training_data:
  ocr_cache:
  paddlex_cache:
  easyocr_cache:
  ai_model_cache:
